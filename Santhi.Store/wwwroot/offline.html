
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>Santhi.Store - Offline</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f5f7fb;
            color: #333;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #0d6efd;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Santhi.Store</h1>
        <h2>You are offline!</h2>

        <p>Please check your internet connection.</p>
        <p>Reconnect to the internet and try again.</p>

        <button onclick="location.reload()">
            Try Again
        </button>
    </div>
</body>
</html>
